name:                aoc26
version:             0.1.0.0
description:         "aoc26"

dependencies:
- base >= 4.7 && < 5
- text
- containers
- unordered-containers
- hashable
- vector
- split
- safe
- either
- megaparsec
- parser-combinators
- optparse-applicative
- witherable
- neat-interpolation
- recursion-schemes
- data-fix
- pretty
- comonad
- distributive
- adjunctions
- machines
- algebraic-graphs
- ansi-terminal
- envparse
- req
- bytestring
- mtl
- aeson
- aeson-pretty
- array

default-extensions:
- OverloadedStrings

ghc-options:
  - -Wall
  - -fmax-uncovered-patterns=99
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wredundant-constraints
  - -Wunused-packages
  - -O2

library:
  source-dirs: src

executables:
  aoc26:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - aoc26

tests:
  aoc26-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O0 # No optimisation for faster test runs
    dependencies:
    - aoc26
    - hspec
    - hspec-discover
    - QuickCheck
    build-tools:
    - hspec-discover

